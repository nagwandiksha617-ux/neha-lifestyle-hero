<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — NEHA Lifestyle</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: oklch(0.97 0.015 62);
      color: oklch(0.25 0.025 43);
      font-family: Montserrat, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 26rem; }
    h1 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 4.5rem; line-height: 1; }
    h2 { margin: 1rem 0 0.5rem; font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.35rem; font-weight: 500; }
    p { margin: 0 0 1.5rem; font-size: 0.875rem; color: oklch(0.45 0.02 43); }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: oklch(0.36 0.09 15);
      color: oklch(0.97 0.015 62);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: inset 0 0 0 1px oklch(0.76 0.09 78);
    }
    a:hover { background: oklch(0.47 0.1 12); }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Go home</a>
  </main>
</body>
</html>
